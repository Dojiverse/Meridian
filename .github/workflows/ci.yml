name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests, including the Hypothesis property suites
        run: pytest -q
      - name: Strict type checking
        run: mypy
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: The two-year history still generates and tells the same story
        run: python -m meridian.showcase /tmp/history.json
